<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Product Reviews &amp; Ratings</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "reviews": "pages/reviews/reviews.html",
  "questions": "pages/questions/questions.html",
  "invitations": "pages/invitations/invitations.html",
  "media-gallery": "pages/media-gallery/media-gallery.html",
  "attribute-templates": "pages/attribute-templates/attribute-templates.html",
  "product-ratings": "pages/product-ratings/product-ratings.html",
  "syndication": "pages/syndication/syndication.html",
  "quality-insights": "pages/quality-insights/quality-insights.html",
  "review-detail": "pages/review-detail/review-detail.html",
  "question-detail": "pages/question-detail/question-detail.html",
  "product-rating-detail": "pages/product-rating-detail/product-rating-detail.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
